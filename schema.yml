        **Notifications:** Eligible drivers within 15km are notified via push. Geofence restrictions are enforced for category-restricted vehicle types.

        **Required fields:** `pickup_lat`, `pickup_lng`, `dropoff_lat`, `dropoff_lng`, `pickup_address`, `dropoff_address`
