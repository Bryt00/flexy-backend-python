        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
          description: ''
        '400':
          description: Refresh token not provided.
        '401':
          description: Invalid/expired token or session expired (logged in elsewhere).
  /v1/auth/register/:
    post:
      operationId: v1_auth_register_create
