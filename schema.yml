  /v1/rides/{id}/track/:
    post:
      operationId: v1_rides_track_create
      description: |-
        Receives the driver's GPS coordinates and recalculates remaining distance/ETA to the next milestone.

        **Throttling:** Google Maps API is only called when:
        - 60+ seconds since last call, OR
        - Driver moved 200+ meters

        **Milestones:**
        - `accepted`/`arrived` → ETA to pickup
        - `in_progress` → ETA to next pending stop or final dropoff

        Updates are broadcast via WebSocket to the ride room.
      summary: Update driver tracking data
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Rides
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingUpdateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrackingUpdateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrackingUpdateRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      - ApiKeyAuth: []
        jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingUpdateResponse'
          description: ''
        '400':
          description: Missing latitude/longitude.
        '403':
          description: Only the assigned driver can update tracking.
  /v1/rides/active/:
    get:
      operationId: v1_rides_active_retrieve
      description: |-
        Returns the single currently active ride for the authenticated user, or `null` if none.

        **Active ride criteria:**
        - Status is `pending`, `accepted`, `arrived`, or `in_progress`
        - OR `completed` within the last 5 minutes (for rating summary screen)
        - Excludes rides the user has already rated
        - Excludes scheduled rides that haven't started yet

        Returns `200` with `null` body (not 404) when no active ride exists — this avoids Dio/HTTP client errors on the Flutter side.
      summary: Get active ride
      tags:
      - Rides
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      - ApiKeyAuth: []
        jwtAuth: []
      responses:
