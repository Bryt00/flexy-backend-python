        - Final fare is calculated using the 8-stage pricing ledger
        - Promo code discount is applied (if any)
        - Driver earnings are processed and credited to wallet
        - Receipt is auto-generated and emailed to rider
        - Referral rewards are triggered (first ride)
        - Push notification sent to rider with fare summary

        **On cancellation (`cancelled`):**
        - Driver ride status is reset in tracking service
