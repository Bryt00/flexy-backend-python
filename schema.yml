  /v1/deliveries/{id}/accept/:
    post:
      operationId: v1_deliveries_accept_create
      description: |-
        Allows a driver to accept a pending delivery request.

        **Restrictions:** Only `PENDING` deliveries can be accepted, and only by users with `driver` role.

        On acceptance:
        - Driver profile is assigned to the delivery
        - Driver is marked as actively riding in the tracking service
        - WebSocket broadcast updates the passenger in real-time
        - The delivery is removed from the discovery stream
      summary: Accept a delivery (driver)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this delivery.
        required: true
      tags:
      - Deliveries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeliveryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeliveryRequest'
        required: true
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      - ApiKeyAuth: []
        jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
          description: ''
        '400':
          description: Delivery already accepted or processed.
        '403':
          description: User is not a driver.
  /v1/deliveries/{id}/status/:
    post:
      operationId: v1_deliveries_status_create
      description: |-
        Transitions a delivery to a new status.

        **Status flow:** `PENDING` → `ACCEPTED` → `AT_PICKUP` → `PACKAGE_COLLECTED` → `EN_ROUTE_TO_DROPOFF` → `ARRIVED_AT_DROPOFF` → `DELIVERED`

        **On completion (`DELIVERED`):** Driver earnings are processed, profile ride count is incremented, and driver tracking status is reset.

        Push notifications are sent to the passenger at each milestone.
      summary: Update delivery status
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this delivery.
        required: true
      tags:
      - Deliveries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryStatusRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeliveryStatusRequestRequest'
