              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
          description: ''
        '400':
          description: Missing signature header or invalid JSON body.
        '401':
          description: Invalid HMAC signature.
