openapi: 3.0.3
info:
  title: FlexyRide API
  version: 1.0.0
  description: |
    ## FlexyRide Backend API v1

    Consolidated REST API powering the FlexyRide ride-hailing, courier delivery, and fleet management platform.

    ### Authentication
    - **JWT Bearer Token** — Obtain via `POST /v1/auth/login/` or `POST /v1/auth/social/`
    - **API Key** — For server-to-server integrations, send `X-Api-Key` header

    ### Base URL
    - Production: `https://api.flexyridegh.com`
    - Staging: `https://staging-api.flexyridegh.com`

    ### Conventions
    - All IDs are UUIDs
    - Monetary values are in GHS (Ghana Cedis) as floats
    - Timestamps are ISO 8601 UTC
    - Paginated lists return `{count, next, previous, results}`
paths:
  /api/advertising/active/:
    get:
      operationId: api_advertising_active_retrieve
      description: |-
        Returns active in-app ad banners for display in the Flutter mobile apps.

        **A/B Testing:** Automatically selects between variant A and variant B. Returns a direct image URL, target URL, and a `tracking_url` for click logging.

        Filter by `app_type`: `PASSENGER` or `DRIVER`.
      summary: Get active in-app ads
      parameters:
      - in: query
        name: app_type
        schema:
          type: string
        description: 'App type filter: PASSENGER or DRIVER.'
      tags:
      - Advertising
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveAdsResponse'
          description: ''
  /api/advertising/click/{ad_id}/:
    get:
      operationId: api_advertising_click_retrieve
      description: Logs a click event for variant A or B, then redirects (HTTP 302)
        to the advertiser's website.
      summary: Log ad click & redirect
      parameters:
      - in: path
        name: ad_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: variant
        schema:
          type: string
        description: 'Variant clicked: A or B.'
      tags:
      - Advertising
      responses:
        '302':
          description: Redirects to advertiser's target URL.
        '400':
          description: Ad has no target URL.
        '404':
          description: Ad not found.
  /api/advertising/impression/:
    post:
      operationId: api_advertising_impression_create
      description: Increments impression counter for a specific ad and A/B variant.
      summary: Log ad impression
      tags:
      - Advertising
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdImpressionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdImpressionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdImpressionRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdImpressionResponse'
          description: ''
        '400':
          description: Missing ad_id.
        '404':
          description: Invalid ad_id.
  /api/auth/token/:
    post:
      operationId: api_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
