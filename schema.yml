          description: Password reset successfully.
        '400':
          description: Invalid/expired OTP or reset token.
        '404':
          description: User with this email does not exist.
  /v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Exchanges a valid refresh token for a new access token and rotated refresh token.

        Includes session key validation — if the user logged in on another device, the old refresh token is invalidated and returns `401 Session expired`.
      summary: Refresh JWT tokens
      tags:
      - Authentication
      requestBody:
        content:
