        - A 4-digit OTP is sent to the provided email for verification.
        - The account remains **inactive** until email verification via `POST /v1/auth/otp/verify/`.
        - An optional `referral_code` triggers double-sided welcome rewards (GH₵ 5.00 promo codes).

