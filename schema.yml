          description: ''
  /v1/rides/estimate/:
    get:
      operationId: v1_rides_estimate_retrieve
      description: |-
        Calculates dynamic fare estimates and real-time driver ETAs for all vehicle categories.

        **How it works:**
        1. Fetches nearby drivers from Redis geospatial index (5km radius)
        2. Groups drivers by vehicle category with closest driver per category
        3. Fetches Google Maps trip metrics (distance, duration, traffic) in parallel
        4. Applies pricing rules (base fare + distance tiers + stops + surge)
        5. Returns per-category estimates with availability and ETA

        **Caching:** Results are cached for 45 seconds per ~50m coordinate grid to reduce Google Maps API costs.

        The `X-Cache` response header indicates `HIT` or `MISS`.
      summary: Get fare estimates
      parameters:
      - in: query
        name: dropoff_lat
        schema:
          type: number
          format: double
        description: Dropoff latitude.
      - in: query
        name: dropoff_lng
        schema:
          type: number
          format: double
        description: Dropoff longitude.
      - in: query
        name: pickup_lat
        schema:
          type: number
          format: double
        description: Pickup latitude.
        required: true
      - in: query
        name: pickup_lng
        schema:
          type: number
          format: double
        description: Pickup longitude.
        required: true
      - in: query
        name: stops
        schema:
          type: string
        description: JSON-encoded array of intermediate stop coordinates [{lat, lng},
          ...].
      tags:
