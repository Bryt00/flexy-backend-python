  /v1/rides/trips/{id}/track/:
    post:
      operationId: v1_rides_trips_track_create
      description: |-
        Receives the driver's GPS coordinates and recalculates remaining distance/ETA to the next milestone.

        **Throttling:** Google Maps API is only called when:
        - 60+ seconds since last call, OR
        - Driver moved 200+ meters

        **Milestones:**
        - `accepted`/`arrived` → ETA to pickup
        - `in_progress` → ETA to next pending stop or final dropoff

        Updates are broadcast via WebSocket to the ride room.
      summary: Update driver tracking data
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this ride.
        required: true
      tags:
      - Rides
      requestBody:
        content:
          application/json:
            schema:
