  /v1/auth/otp/request/:
    post:
      operationId: v1_auth_otp_request_create
      description: |-
        Sends a 4-digit OTP to the provided email address.

        **Types:**
        - `email_verification` — For new account email verification
        - `password_reset` — For forgotten password flow

        Rate limited to 1 request per 2 minutes per user per type. OTP expires after 10 minutes.
      summary: Request an OTP code
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPSentResponse'
          description: OTP sent successfully.
        '404':
          description: User with this email does not exist.
        '429':
          description: Rate limited — please wait 2 minutes between requests.
  /v1/auth/otp/verify/:
    post:
      operationId: v1_auth_otp_verify_create
      description: |-
        Validates the 4-digit OTP sent to the user's email.

        **Behaviour by type:**
        - `email_verification` — Activates the account, sends welcome email, returns JWT tokens.
        - `password_reset` — Returns a signed `reset_token` (valid 15 minutes) for use with `POST /v1/auth/password/reset/`.

        OTPs are single-use and expire after 10 minutes.
      summary: Verify an OTP code
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPVerifyResponse'
          description: OTP verified successfully.
        '400':
          description: Invalid or expired OTP.
  /v1/auth/password/change/:
    post:
      operationId: v1_auth_password_change_create
      description: |-
        Changes the authenticated user's password.

        Requires the current password for verification. On success:
        - All existing sessions are invalidated (session_key rotated)
        - A security notification email is sent

        The new password must pass Django's password validation rules.
      summary: Change password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - ApiKeyAuth: []
      - ApiKeyAuth: []
        jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
          description: Password changed successfully.
        '400':
          description: Missing fields, incorrect current password, or weak new password.
  /v1/auth/password/reset/:
    post:
      operationId: v1_auth_password_reset_create
      description: |-
        Sets a new password for the user. Requires either:

        1. A `reset_token` obtained from `POST /v1/auth/otp/verify/` (preferred, valid 15 min), OR
        2. A raw `otp` code (fallback)

        On success, all existing sessions are invalidated (session_key rotated) and a security notification email is sent.
      summary: Reset password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
