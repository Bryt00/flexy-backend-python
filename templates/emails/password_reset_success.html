<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Outfit', 'Inter', sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 40px auto; background: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; }
        .header { padding: 30px; text-align: center; color: #1e293b; border-bottom: 1px solid #f1f5f9; }
        .content { padding: 40px; text-align: center; color: #334155; }
        .alert-box { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 16px; border-radius: 8px; margin: 20px 0; font-weight: 600; }
        .footer { padding: 20px; text-align: center; color: #94a3b8; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Password Changed</h2>
        </div>
        <div class="content">
            <p>Hello,</p>
            <div class="alert-box">Your FlexyRide account password was successfully updated.</div>
            <p style="color: #64748b; font-size: 14px; line-height: 1.6;">If you performed this action, no further steps are needed.<br>If you did <strong>not</strong> request this change, please reset your password immediately or contact support.</p>
        </div>
        <div class="footer">
            &copy; 2026 FlexyRide Ltd.
        </div>
    </div>
</body>
</html>
